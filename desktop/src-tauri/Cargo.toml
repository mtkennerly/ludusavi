[package]
name = "desktop"
version = "0.1.0"
description = "Tauri frontend for Ludusavi's per-game cloud sync"
authors = ["ludusavi-sync contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Rust core of the fork: config/scan/cloud/sync logic, bound directly via
# api.rs's `Ludusavi` struct rather than a subprocess. No `app` feature (that
# gates the CLI's clap/dialoguer/rfd, not needed from a Tauri backend).
ludusavi = { path = "../..", default-features = false }

