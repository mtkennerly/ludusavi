name: Build ludusavi Packages

on:
  push:
    tags:
      - 'v*'
      - '0.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: "AppImage (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch v0.31.0 https://github.com/mtkennerly/ludusavi.git ludusavi-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fuse libfuse2 libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev pkg-config libgtk-3-dev librsvg2-dev libsqlite3-dev

      - name: Build ludusavi
        run: |
          cd ludusavi-src
          cargo build --release
          mkdir -p ../appdir/usr/bin
          cp target/release/ludusavi ../appdir/usr/bin/ludusavi

      - name: Create AppDir structure
        run: |
          mkdir -p appdir/usr/share/applications appdir/usr/share/icons/hicolor/256x256/apps appdir/usr/share/metainfo
          cat > appdir/ludusavi.desktop << 'EOF'
          [Desktop Entry]
          Name=ludusavi
          Comment=Game save backup tool
          Exec=ludusavi
          Icon=ludusavi
          Terminal=false
          Type=Application
          Categories=Game;Utility;
          EOF
          cp ludusavi-src/assets/icon.svg appdir/ludusavi.svg
          cp ludusavi-src/assets/icon.png appdir/ludusavi.png

      - name: Create AppRun
        run: |
          cat > appdir/AppRun << 'EOF'
          #!/bin/bash
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/ludusavi" "$@"
          EOF
          chmod +x appdir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool --no-appstream appdir ludusavi-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-appimage
          path: ludusavi-x86_64.AppImage

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# ludusavi $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Game save backup tool for 19,000+ games." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x ludusavi-x86_64.AppImage" >> release_notes.md
          echo "./ludusavi-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i ludusavi_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i ludusavi-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U ludusavi-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Tarball" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "tar -xzf ludusavi-*.tar.gz" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Release AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ludusavi-x86_64.AppImage
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deb:
    name: "Debian Package (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch v0.31.0 https://github.com/mtkennerly/ludusavi.git ludusavi-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl devscripts debhelper-compat libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev pkg-config libgtk-3-dev librsvg2-dev libsqlite3-dev libssl-dev

      - name: Install newer Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare source
        run: |
          mkdir -p ludusavi-0.31.0/debian
          cp -r debian/* ludusavi-0.31.0/debian/
          cd ludusavi-src && git archive HEAD | tar -x -C ../ludusavi-0.31.0

      - name: Build Debian package
        run: |
          # Symlink cargo to /usr/local/bin so debuild-sanitized PATH finds it
          ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
          cd ludusavi-0.31.0
          debuild -us -uc -b

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-deb
          path: ludusavi_*.deb

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# ludusavi $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Game save backup tool for 19,000+ games." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x ludusavi-x86_64.AppImage" >> release_notes.md
          echo "./ludusavi-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i ludusavi_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i ludusavi-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U ludusavi-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Tarball" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "tar -xzf ludusavi-*.tar.gz" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Release Debian package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ludusavi_*.deb
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    name: "RPM Package (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch v0.31.0 https://github.com/mtkennerly/ludusavi.git ludusavi-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libwebkit2gtk-4.1-dev libgtk-3-dev libsqlite3-dev libssl-dev pkg-config

      - name: Prepare RPM source
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp rpmbuild/SPECS/ludusavi.spec ~/rpmbuild/SPECS/
          cd ludusavi-src && git archive --prefix=ludusavi-0.31.0/ --format=tar.gz HEAD > ~/rpmbuild/SOURCES/ludusavi-0.31.0.tar.gz

      - name: Build RPM
        run: |
          rpmbuild -bb --nodeps ~/rpmbuild/SPECS/ludusavi.spec

      - name: Copy RPM to workspace
        run: |
          cp ~/rpmbuild/RPMS/x86_64/ludusavi-*.rpm .

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-rpm
          path: ludusavi-*.rpm

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# ludusavi $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Game save backup tool for 19,000+ games." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x ludusavi-x86_64.AppImage" >> release_notes.md
          echo "./ludusavi-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i ludusavi_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i ludusavi-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U ludusavi-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Tarball" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "tar -xzf ludusavi-*.tar.gz" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Release RPM
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ludusavi-*.rpm
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pacman:
    name: "Pacman Package (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Pacman package in Arch Linux container
        run: |
          docker run --rm -v "${{ github.workspace }}":/work archlinux/archlinux:latest bash -c "
            pacman -Syu --noconfirm base-devel
            cd /work
            cat > PKGBUILD << 'PKGBUILD_EOF'
            # Maintainer: Matthew T. Kennerly <mtkennerly@gmail.com>
            pkgname=ludusavi
            pkgver=0.31.0
            pkgrel=1
            pkgdesc=\"Game save backup tool\"
            arch=('x86_64')
            url=\"https://github.com/mtkennerly/ludusavi\"
            license=('MIT')
            depends=('gcc-libs' 'glibc' 'gtk3' 'webkit2gtk' 'sqlite' 'openssl' 'librsvg' 'pango' 'cairo')
            makedepends=('cargo' 'rust')
            source=(\"https://github.com/mtkennerly/ludusavi/archive/v\${pkgver}.tar.gz\")
            sha256sums=('SKIP')

            build() {
              cd \"\${srcdir}/\${pkgname}-\${pkgver}\"
              cargo build --release
            }

            package() {
              cd \"\${srcdir}/\${pkgname}-\${pkgver}\"
              install -Dm755 \"target/release/\${pkgname}\" \"\${pkgdir}/usr/bin/\${pkgname}\"
              install -Dm644 LICENSE \"\${pkgdir}/usr/share/licenses/\${pkgname}/LICENSE\"
              install -Dm644 README.md \"\${pkgdir}/usr/share/doc/\${pkgname}/README.md\"
            }
            PKGBUILD_EOF
            chown -R builduser:builduser .
            su builduser -c 'makepkg -f --noconfirm --skippgpcheck'
          "

      - name: Upload Pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-pacman
          path: ludusavi-*.pkg.tar.zst

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# ludusavi $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Game save backup tool for 19,000+ games." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x ludusavi-x86_64.AppImage" >> release_notes.md
          echo "./ludusavi-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i ludusavi_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i ludusavi-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U ludusavi-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Tarball" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "tar -xzf ludusavi-*.tar.gz" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Release Pacman package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ludusavi-*.pkg.tar.zst
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tarball:
    name: "Tarball (amd64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch v0.31.0 https://github.com/mtkennerly/ludusavi.git ludusavi-src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev pkg-config libgtk-3-dev librsvg2-dev libsqlite3-dev

      - name: Build ludusavi
        run: |
          cd ludusavi-src
          cargo build --release

      - name: Create tarball
        run: |
          mkdir -p ludusavi-0.31.0-linux-x86_64/usr/bin
          cp ludusavi-src/target/release/ludusavi ludusavi-0.31.0-linux-x86_64/usr/bin/ludusavi
          cp ludusavi-src/LICENSE ludusavi-0.31.0-linux-x86_64/
          cp ludusavi-src/README.md ludusavi-0.31.0-linux-x86_64/
          tar -czf ludusavi-0.31.0-linux-x86_64.tar.gz ludusavi-0.31.0-linux-x86_64

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-tarball
          path: ludusavi-*.tar.gz

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "# ludusavi $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Game save backup tool for 19,000+ games." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### AppImage (Universal)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "chmod +x ludusavi-x86_64.AppImage" >> release_notes.md
          echo "./ludusavi-x86_64.AppImage" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Debian/Ubuntu" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo dpkg -i ludusavi_*.deb" >> release_notes.md
          echo "sudo apt-get install -f" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### RPM (Fedora/RHEL/openSUSE)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo rpm -i ludusavi-*.rpm" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Pacman (Arch/Manjaro)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sudo pacman -U ludusavi-*.pkg.tar.zst" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Tarball" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "tar -xzf ludusavi-*.tar.gz" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Release tarball
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ludusavi-*.tar.gz
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
